<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>ThinkPad E480 - Oferta</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: linear-gradient(135deg, #0a0c15 0%, #1a1f2e 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
            padding: 20px;
        }

        /* Contenedor principal: exactamente la imagen, centrada, con sombra elegante */
        .image-container {
            max-width: 1100px;
            width: 100%;
            margin: 0 auto;
            display: flex;
            justify-content: center;
            align-items: center;
            background: transparent;
            border-radius: 32px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5), 0 0 0 1px rgba(255,255,255,0.08);
            overflow: hidden;
            transition: transform 0.2s ease;
        }

        /* La imagen se ajusta completamente, centrada y responsiva */
        .image-container img {
            width: 100%;
            height: auto;
            display: block;
            object-fit: contain;
            /* permite que la imagen se vea nítida y centrada */
            max-width: 100%;
            transition: all 0.3s;
        }

        /* Pequeño detalle: si la imagen no carga, mostrar mensaje visual atractivo */
        .fallback-message {
            background: #1e243b;
            border-radius: 48px;
            padding: 60px 40px;
            text-align: center;
            color: white;
            width: 100%;
            font-weight: 500;
            backdrop-filter: blur(4px);
        }

        .fallback-message i {
            font-size: 3.5rem;
            margin-bottom: 20px;
            display: block;
            color: #ffaa44;
        }

        /* efecto sutil hover para darle vida */
        .image-container:hover {
            transform: scale(1.01);
            box-shadow: 0 30px 60px -12px rgba(0, 0, 0, 0.6);
        }

        /* hint para pantallazo (opcional, pero ayuda visual) */
        .snap-hint {
            position: fixed;
            bottom: 18px;
            right: 18px;
            background: rgba(0,0,0,0.7);
            backdrop-filter: blur(12px);
            padding: 8px 18px;
            border-radius: 60px;
            color: #fff;
            font-size: 0.7rem;
            font-weight: 500;
            font-family: monospace;
            letter-spacing: 0.5px;
            pointer-events: none;
            z-index: 999;
            border: 1px solid rgba(255,255,255,0.2);
        }

        .snap-hint i {
            margin-right: 6px;
            font-size: 0.75rem;
        }

        /* Ajuste para móviles: centrado perfecto */
        @media (max-width: 768px) {
            body {
                padding: 12px;
            }
            .snap-hint {
                bottom: 12px;
                right: 12px;
                font-size: 0.65rem;
                padding: 6px 14px;
            }
        }

        /* Modo oscuro/imagen destacada */
        html {
            background: #0b0f17;
        }
    </style>
    <!-- Font Awesome solo para el icono del hint (sin afectar la imagen) -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
</head>
<body>
    <div class="snap-hint">
        <i class="fas fa-camera"></i> PANTALLAZO · IMAGEN CENTRADA
    </div>

    <div class="image-container">
        <!-- IMAGEN DESDE CARPETA RAÍZ: /img/publicidad.jpeg 
             Se ajusta 100% al contenedor, centrada y responsiva -->
        <img src="img/publicidad.png" 
             alt="Publicidad ThinkPad E480 - Oferta especial"
             onerror="this.onerror=null; this.style.display='none'; this.parentElement.innerHTML = '<div class=\'fallback-message\'><i class=\'fas fa-image\'></i><span style=\'font-size:1.4rem; font-weight:bold;\'>📁 publicidad.jpeg no encontrada</span><br><span style=\'font-size:0.9rem; margin-top:12px; display:inline-block;\'>Verifica que exista la carpeta <strong style=\'color:#ffaa66;\'>/img</strong> y dentro el archivo <strong style=\'color:#ffaa66;\'>publicidad.jpeg</strong></span></div>'">
    </div>

    <script>
        // Asegurar que la imagen se muestre centrada incluso si hay problemas de carga
        // El código ya tiene onerror, pero adicionalmente si la imagen es válida pero no carga por ruta, se aplica fallback.
        // También forzamos que la imagen mantenga su proporción.
        window.addEventListener('load', function() {
            const img = document.querySelector('.image-container img');
            if (img && img.complete && img.naturalWidth === 0) {
                // si el onerror no se disparó de forma inmediata (edge case)
                if (!img.hasAttribute('data-fallback')) {
                    img.setAttribute('data-fallback', 'true');
                    img.style.display = 'none';
                    const parent = img.parentElement;
                    if (parent && !parent.querySelector('.fallback-message')) {
                        const fbDiv = document.createElement('div');
                        fbDiv.className = 'fallback-message';
                        fbDiv.innerHTML = '<i class="fas fa-folder-open"></i><span style="font-size:1.3rem; font-weight:600;">⚠️ No se encontró la imagen</span><br><span style="font-size:0.85rem; margin-top:10px; display:inline-block;">Ruta esperada: <strong style="background:#00000055; padding:4px 8px; border-radius:50px;">/img/publicidad.jpeg</strong><br>Asegúrate de colocar tu archivo en esa ubicación.</span>';
                        parent.appendChild(fbDiv);
                    }
                }
            }
        });
    </script>
</body>
</html>
